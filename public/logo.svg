<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Book & Plane Compass Icon -->
  <g transform="translate(96, 96)" filter="url(#shadow)">
    <!-- Book base -->
    <path d="M40 250 C80 230, 130 230, 160 250 C190 230, 240 230, 280 250 L280 90 C240 70, 190 70, 160 90 C130 70, 80 70, 40 90 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M160 90 L160 250" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Paper flight / Travel swoosh -->
    <path d="M80 180 Q 160 60 240 70" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8"/>
    <polygon points="255,68 230,55 235,78" fill="#38bdf8"/>
    
    <!-- Letter A -->
    <text x="100" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#4f46e5">A</text>
    <text x="185" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#0284c7">文</text>
  </g>
</svg>
